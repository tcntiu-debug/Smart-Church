name: Deploy to cPanel

# ---------------------------------------------------------------------------
# Push to main/master  ->  build the app  ->  publish to cPanel over SFTP (SSH)
#
# WHY SFTP (port 22) AND NOT FTPS?
#   This server's FTPS passive-mode data ports are filtered/flaky when reached
#   from GitHub's runners ("Timeout when trying to open data connection to ..."),
#   which aborts the upload halfway through and leaves a half-written tree that
#   shows "Index of /" instead of the app. SFTP rides the single SSH connection,
#   so it transfers reliably. The cPanel account accepts SSH password logins.
#   See docs/DEPLOY-dev.lit-grp.com.md -> "Transports: FTPS vs SFTP".
#
# Required repository secrets  (Settings > Secrets and variables > Actions):
#   CPANEL_HOST      SSH hostname, e.g. ftp.lit-grp.com or your domain
#   CPANEL_USER      cPanel username (e.g. litgrpco)
#   CPANEL_PASSWORD  matching password (now used for the SSH login)
#
# Optional repository variables (same screen, "Variables" tab):
#   CPANEL_SSH_PORT   22 (default)
#   CPANEL_REMOTE_DIR publish directory RELATIVE to the account home (~), e.g.
#                     public_html/dev.lit-grp.com/   (default: public_html/)
#
# See docs/CPANEL-DEPLOYMENT.md for the full walkthrough.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      note:
        description: Short note describing this manual deployment
        required: false
        default: Manual deployment

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Matches the Local dev environment (PHP 8.0.30) and composer.json ("php": "^7.3|^8.0").
  # Change to 8.1/8.2 only if your cPanel account runs that version.
  PHP_VERSION: '8.0'

jobs:
  deploy:
    name: Build and publish to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, json, mbstring, openssl, pdo, pdo_mysql, session, simplexml, tokenizer, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Create build-time .env
        run: cp .env.example .env

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate build-time application key
        run: php artisan key:generate --force

      - name: Rebuild the package manifest
        run: php artisan package:discover --ansi

      - name: Smoke test the build
        run: |
          php -l public/index.php
          php -r "require 'vendor/autoload.php'; echo 'Composer autoloader OK', PHP_EOL;"
          php artisan --version

      - name: Validate deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          missing=0
          for pair in "CPANEL_HOST:$CPANEL_HOST" "CPANEL_USER:$CPANEL_USER" "CPANEL_PASSWORD:$CPANEL_PASSWORD"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error title=Missing repository secret::$name is not set. See docs/CPANEL-DEPLOYMENT.md."
              missing=1
            fi
          done
          exit $missing

      # Build ONE archive of exactly the files that belong on the server, then send
      # it as a single stream over SSH. This replaces the old FTPS sync, which kept
      # dying on "Timeout when trying to open data connection".
      - name: Stage deployment payload (tar)
        run: |
          set -euo pipefail
          # Write the archive OUTSIDE the tree being archived (so tar never reads the
          # file it is still writing), then copy it in for the upload step.
          PAYLOAD="$RUNNER_TEMP/smart-church-deploy.tar.gz"
          rm -f "$PAYLOAD"
          if ! tar -czf "$PAYLOAD" \
              --exclude='./.git' --exclude='./.github' --exclude='./.idea' \
              --exclude='./.vscode' --exclude='./.fleet' --exclude='./node_modules' \
              --exclude='./.gitignore' --exclude='./.gitattributes' \
              --exclude='./.editorconfig' --exclude='./.styleci.yml' \
              --exclude='./.env' --exclude='./.env.*' \
              --exclude='./.ftp-deploy-sync-state.json' \
              --exclude='./package.json' --exclude='./webpack.mix.js' \
              --exclude='./phpunit.xml' --exclude='./tests' --exclude='./docs' \
              --exclude='./scripts' --exclude='./README.md' \
              --exclude='./check_*.php' --exclude='./debug_*.php' \
              --exclude='./fix_escape.php' --exclude='./task_progress.json' \
              --exclude='./test-login.html' --exclude='./public/test-login.html' \
              -C "$GITHUB_WORKSPACE" . 2>"$RUNNER_TEMP/tar.err"; then
            echo "::error title=tar staging failed::$(tr '\n' '|' < "$RUNNER_TEMP/tar.err" | head -c 900)"
            exit 1
          fi
          cp "$PAYLOAD" smart-church-deploy.tar.gz
          echo "Payload size: $(du -h smart-church-deploy.tar.gz | cut -f1)"
          echo "Sanity check - these ROOT entries must be present (they carry the"
          echo "front controller and were exactly what the failed FTPS run never sent):"
          tar -tzf smart-church-deploy.tar.gz | grep -E '\.htaccess$|/artisan$|/composer\.json$|/server\.php$' || echo "::warning title=payload check::expected root files were not found in the archive"

      - name: Publish to cPanel (SFTP/SSH)
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || 22 }}
          REMOTE_DIR: ${{ vars.CPANEL_REMOTE_DIR || 'public_html/' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          APP_DIR="/home/${SSH_USER}/${REMOTE_DIR%/}"
          TARBALL="/home/${SSH_USER}/smart-church-deploy.tar.gz"
          # sshpass -e reads the password from $SSHPASS - it never hits the command line.
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=25 -p ${SSH_PORT}"
          SCP_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=25 -P ${SSH_PORT}"

          echo "==> Probing SSH login to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          if ! sshpass -e ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
              'echo connected to $(hostname); echo HOME=$HOME; command -v tar; command -v php || true' 2>ssh.err; then
            echo "::error title=SSH login failed::$(tr '\n' '|' < ssh.err | head -c 900)"
            exit 1
          fi

          echo "==> Uploading payload to ${TARBALL}"
          if ! sshpass -e scp $SCP_OPTS smart-church-deploy.tar.gz "${SSH_USER}@${SSH_HOST}:${TARBALL}" 2>upload.err; then
            echo "::error title=scp upload failed::$(tr '\n' '|' < upload.err | head -c 900)"
            exit 1
          fi

          echo "==> Extracting into ${APP_DIR} and bootstrapping"
          if ! sshpass -e ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "
            set -e
            test -f '${TARBALL}' || { echo 'payload missing'; exit 1; }
            mkdir -p '${APP_DIR}'
            tar -xzf '${TARBALL}' -C '${APP_DIR}'
            rm -f '${TARBALL}'
            ls -la '${APP_DIR}'
            if [ -f '${APP_DIR}/.env' ]; then
              cd '${APP_DIR}'
              (command -v php >/dev/null 2>&1 && php artisan app:post-deploy) || echo 'NOTE: skipped or failed app:post-deploy'
            else
              echo 'NOTE: .env missing - skipping artisan (create the server .env first)'
            fi
            echo 'Publish complete.'
          " 2>extract.err; then
            echo "::error title=remote extract failed::$(tr '\n' '|' < extract.err | head -c 900)"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## cPanel deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Transport | \`sftp:${{ vars.CPANEL_SSH_PORT || 22 }}\` |"
            echo "| Remote directory | \`${{ vars.CPANEL_REMOTE_DIR || 'public_html/' }}\` |"
            echo "| Triggered by | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
