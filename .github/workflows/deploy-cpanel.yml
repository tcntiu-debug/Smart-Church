name: Deploy to cPanel

# ---------------------------------------------------------------------------
# Push to main/master  ->  build the app  ->  publish to cPanel over SFTP (SSH)
#
# WHY SFTP (port 22) AND NOT FTPS?
#   This server's FTPS passive-mode data ports are filtered/flaky when reached
#   from GitHub's runners ("Timeout when trying to open data connection to ..."),
#   which aborts the upload halfway through and leaves a half-written tree that
#   shows "Index of /" instead of the app. SFTP rides the single SSH connection,
#   so it transfers reliably. The cPanel account accepts SSH password logins.
#   See docs/DEPLOY-dev.lit-grp.com.md -> "Transports: FTPS vs SFTP".
#
# Required repository secrets  (Settings > Secrets and variables > Actions):
#   CPANEL_HOST      SSH hostname, e.g. ftp.lit-grp.com or your domain
#   CPANEL_USER      cPanel username (e.g. litgrpco)
#   CPANEL_PASSWORD  matching password (now used for the SSH login)
#
# Optional repository variables (same screen, "Variables" tab):
#   CPANEL_SSH_PORT   22 (default)
#   CPANEL_REMOTE_DIR publish directory RELATIVE to the account home (~), e.g.
#                     public_html/dev.lit-grp.com/   (default: public_html/)
#
# See docs/CPANEL-DEPLOYMENT.md for the full walkthrough.
#
# DELETIONS ARE PROPAGATED TOO
#   A reverse mirror only adds and overwrites, so a file removed from the
#   repository would linger on the server forever. The "Prune files deleted
#   from the repository" step closes that gap: it diffs the last successful
#   deploy against this commit and removes exactly the paths `git rm` took
#   out of the tree - never anything that only lives on the server (.env,
#   storage/app/public member photos, public/uploads, public/display_photo,
#   public/gallery_uploads, public/storage, bootstrap/cache, .well-known).
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      note:
        description: Short note describing this manual deployment
        required: false
        default: Manual deployment

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Read the run history to find the last SUCCESSFUL deploy (the pruning
  # baseline). Without it we fall back to the push's `before` SHA.
  actions: read

env:
  # Matches the Local dev environment (PHP 8.0.30) and composer.json ("php": "^7.3|^8.0").
  # Change to 8.1/8.2 only if your cPanel account runs that version.
  PHP_VERSION: '8.0'

jobs:
  deploy:
    name: Build and publish to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the pruning step diffs this commit against the last
          # successfully deployed one to know exactly what was deleted.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, json, mbstring, openssl, pdo, pdo_mysql, session, simplexml, tokenizer, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Create build-time .env
        run: cp .env.example .env

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate build-time application key
        run: php artisan key:generate --force

      - name: Rebuild the package manifest
        run: php artisan package:discover --ansi

      - name: Smoke test the build
        run: |
          php -l public/index.php
          php -r "require 'vendor/autoload.php'; echo 'Composer autoloader OK', PHP_EOL;"
          php artisan --version

      - name: Validate deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          missing=0
          for pair in "CPANEL_HOST:$CPANEL_HOST" "CPANEL_USER:$CPANEL_USER" "CPANEL_PASSWORD:$CPANEL_PASSWORD"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error title=Missing repository secret::$name is not set. See docs/CPANEL-DEPLOYMENT.md."
              missing=1
            fi
          done
          exit $missing

      # Build ONE archive of exactly the files that belong on the server, then send
      # it as a single stream over SSH. This replaces the old FTPS sync, which kept
      # dying on "Timeout when trying to open data connection".
      - name: Stage deployment payload (tar)
        run: |
          set -euo pipefail
          # Write the archive OUTSIDE the tree being archived (so tar never reads the
          # file it is still writing), then copy it in for the upload step.
          PAYLOAD="$RUNNER_TEMP/smart-church-deploy.tar.gz"
          rm -f "$PAYLOAD"
          if ! tar -czf "$PAYLOAD" \
              --exclude='./.git' --exclude='./.github' --exclude='./.idea' \
              --exclude='./.vscode' --exclude='./.fleet' --exclude='./node_modules' \
              --exclude='./.gitignore' --exclude='./.gitattributes' \
              --exclude='./.editorconfig' --exclude='./.styleci.yml' \
              --exclude='./.env' --exclude='./.env.*' \
              --exclude='./.ftp-deploy-sync-state.json' \
              --exclude='./package.json' --exclude='./webpack.mix.js' \
              --exclude='./phpunit.xml' --exclude='./tests' --exclude='./docs' \
              --exclude='./scripts' --exclude='./README.md' \
              --exclude='./check_*.php' --exclude='./debug_*.php' \
              --exclude='./fix_escape.php' --exclude='./task_progress.json' \
              --exclude='./test-login.html' --exclude='./public/test-login.html' \
              -C "$GITHUB_WORKSPACE" . 2>"$RUNNER_TEMP/tar.err"; then
            echo "::error title=tar staging failed::$(tr '\n' '|' < "$RUNNER_TEMP/tar.err" | head -c 900)"
            exit 1
          fi
          cp "$PAYLOAD" smart-church-deploy.tar.gz
          echo "Payload size: $(du -h smart-church-deploy.tar.gz | cut -f1)"
          echo "Sanity check - these ROOT entries must be present (they carry the"
          echo "front controller and were exactly what the failed FTPS run never sent):"
          tar -tzf smart-church-deploy.tar.gz | grep -E '\.htaccess$|/artisan$|/composer\.json$|/server\.php$' || echo "::warning title=payload check::expected root files were not found in the archive"

      - name: Publish to cPanel (SFTP)
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || 22 }}
          REMOTE_DIR: ${{ vars.CPANEL_REMOTE_DIR || 'public_html/dev.lit-grp.com/' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp rsync

          # This cPanel account is SFTP-ONLY ("Shell access is not enabled on your
          # account"), so we must NOT run remote commands - no tar/composer/artisan over
          # SSH. Instead we mirror the built files through the SFTP subsystem with lftp,
          # which is robust and parallel. Paths are relative to the SFTP home, so they do
          # not depend on the /home/<user> prefix.
          STAGE="$RUNNER_TEMP/site"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.idea' \
            --exclude='.vscode' --exclude='.fleet' --exclude='node_modules' \
            --exclude='.gitignore' --exclude='.gitattributes' \
            --exclude='.editorconfig' --exclude='.styleci.yml' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.ftp-deploy-sync-state.json' \
            --exclude='package.json' --exclude='webpack.mix.js' \
            --exclude='phpunit.xml' --exclude='tests' --exclude='docs' \
            --exclude='scripts' --exclude='README.md' \
            --exclude='check_*.php' --exclude='debug_*.php' \
            --exclude='fix_escape.php' --exclude='task_progress.json' \
            --exclude='test-login.html' --exclude='public/test-login.html' \
            --exclude='smart-church-deploy.tar.gz' \
            "$GITHUB_WORKSPACE/" "$STAGE/"
          echo "Staged $(find "$STAGE" -type f | wc -l) files; root listing:"
          ls -la "$STAGE" | head -40

          echo "==> Mirroring to sftp://${SSH_HOST}:${SSH_PORT}/${REMOTE_DIR%/}"
          set +e
          LFTP_PASSWORD="$SSHPASS" lftp --env-password -u "$SSH_USER" "sftp://${SSH_HOST}:${SSH_PORT}" >lftp.out 2>&1 <<LFTP
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 4
          mkdir -p "${REMOTE_DIR%/}"
          mirror -R --verbose=1 --no-perms --no-symlinks "$STAGE/" "${REMOTE_DIR%/}"
          bye
          LFTP
          rc=$?
          set -e
          echo "::notice title=lftp output::$(tail -c 2500 lftp.out | tr '\n' '|')"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=SFTP upload failed (lftp exit $rc)::see the 'lftp output' notice"
            exit 1
          fi
          echo "==> Upload complete. Files are on the server (artisan commands are NOT run:"
          echo "    the account has no shell - see docs/DEPLOY-dev.lit-grp.com.md)."

      # A reverse mirror only ADDS and OVERWRITES - it never removes, so a file
      # deleted from the repository would survive on the server forever. This step
      # removes exactly the paths `git diff` reports as deleted since the last
      # successful deployment of this workflow. It is deliberately precise: a
      # blanket `mirror --delete` would also wipe everything that only ever exists
      # on the server (.env, storage/app/public member photos, public/uploads,
      # public/display_photo, public/gallery_uploads, the public/storage symlink,
      # bootstrap/cache, .well-known ...).
      - name: Prune files deleted from the repository
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || 22 }}
          REMOTE_DIR: ${{ vars.CPANEL_REMOTE_DIR || 'public_html/dev.lit-grp.com/' }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Baseline = the commit of the last SUCCESSFUL run of this workflow, so a
          # deploy that failed on an earlier push never lets its deletions slip.
          # Falls back to the push's `before` SHA and finally to the root commit.
          BASELINE="$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cpanel.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null | tr -d '[:space:]' || true)"

          if ! git cat-file -e "${BASELINE:-none}^{commit}" 2>/dev/null; then
            BASELINE="${BEFORE_SHA:-}"
          fi
          if ! git cat-file -e "${BASELINE:-none}^{commit}" 2>/dev/null; then
            BASELINE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "Pruning removals between ${BASELINE:0:7} and ${GITHUB_SHA:0:7}"

          # Paths that only exist on the server must survive even a mistaken `git rm`.
          PROTECTED='^(\.env($|\.)|bootstrap/cache/|storage/|public/uploads/|public/display_photo/|public/gallery_uploads/|public/storage$|\.well-known/|vendor/|node_modules/)'

          # Paths the publish step never uploads (its rsync --exclude list), so there
          # is nothing to prune there and no missing-file noise either.
          NEVER_UPLOADED='^(tests/|docs/|scripts/|\.git|\.idea/|\.vscode/|\.fleet/|\.gitignore$|\.gitattributes$|\.editorconfig$|\.styleci\.yml$|package\.json$|webpack\.mix\.js$|phpunit\.xml$|README\.md$|check_.*\.php$|debug_.*\.php$|fix_escape\.php$|task_progress\.json$|test-login\.html$)'

          # --no-renames so a move shows up as delete + add, never as a silent rename.
          git diff --no-renames --diff-filter=D --name-only "$BASELINE" "$GITHUB_SHA" \
            | grep -v -E "$PROTECTED" | grep -v -E "$NEVER_UPLOADED" > "$RUNNER_TEMP/prune.txt" || true

          if [ ! -s "$RUNNER_TEMP/prune.txt" ]; then
            echo "Nothing to prune - the server already matches the repository."
            exit 0
          fi

          echo "Remote paths to remove:"
          sed 's/^/   - /' "$RUNNER_TEMP/prune.txt"

          # Remove the files, then the directories they emptied (deepest first).
          # `rmdir` cannot touch a directory that still holds live files, which is
          # the safety net for anything uploaded outside the repository.
          awk -F/ '{d=""; for(i=1;i<NF;i++){d=d (i>1?"/":"") $i; print d}}' \
            "$RUNNER_TEMP/prune.txt" | sort -ru > "$RUNNER_TEMP/prune-dirs.txt"

          {
            echo 'set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"'
            echo 'set sftp:auto-confirm yes'
            echo 'set net:max-retries 3'
            echo 'set net:timeout 30'
            echo 'set net:reconnect-interval-base 5'
            echo "cd \"${REMOTE_DIR%/}\""
            while IFS= read -r file; do echo "rm -f \"$file\""; done < "$RUNNER_TEMP/prune.txt"
            while IFS= read -r dir; do echo "rmdir -f \"$dir\""; done < "$RUNNER_TEMP/prune-dirs.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/prune.lftp"

          # Same invocation the publish step uses (site argument + commands on
          # stdin). Wait between attempts so a flaky connection cannot leave half
          # the deletions applied: lftp retries the failed command.
          PRUNE_CMDS="$(cat "$RUNNER_TEMP/prune.lftp")"

          set +e
          LFTP_PASSWORD="$SSHPASS" lftp --env-password -u "$SSH_USER" "sftp://${SSH_HOST}:${SSH_PORT}" >lftp-prune.out 2>&1 <<LFTP
          $PRUNE_CMDS
          LFTP
          rc=$?
          set -e

          echo "::notice title=lftp prune output::$(tail -c 2000 lftp-prune.out | tr '\n' '|')"

          if [ "$rc" -ne 0 ]; then
            echo "::error title=SFTP prune failed (lftp exit $rc)::the code deploy itself succeeded, but stale files were left on the server - see the 'lftp prune output' notice"
            exit 1
          fi

          if grep -qiE 'access failed|no such file' lftp-prune.out; then
            echo "::warning title=prune warnings::some paths could not be removed - see the 'lftp prune output' notice"
          fi

          echo "Pruned $(wc -l < "$RUNNER_TEMP/prune.txt") path(s) from ${REMOTE_DIR%/}"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## cPanel deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Transport | \`sftp:${{ vars.CPANEL_SSH_PORT || 22 }}\` |"
            echo "| Remote directory | \`${{ vars.CPANEL_REMOTE_DIR || 'public_html/' }}\` |"
            echo "| Triggered by | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
