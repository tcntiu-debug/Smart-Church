name: Deploy to cPanel

# ---------------------------------------------------------------------------
# Push to main/master  ->  build the app  ->  publish to cPanel over FTPS
#
# Required repository secrets  (Settings > Secrets and variables > Actions):
#   CPANEL_HOST      FTP/SFTP hostname, e.g. server123.webhost.com or your domain
#   CPANEL_USER      cPanel username, or a dedicated FTP account
#   CPANEL_PASSWORD  matching password
#
# Optional repository variables (same screen, "Variables" tab):
#   CPANEL_PROTOCOL   ftps (default) | ftp   <- this action is FTP/FTPS only (no SFTP)
#   CPANEL_PORT       21 (default)
#   CPANEL_REMOTE_DIR remote directory to publish into (default: public_html/)
#                     for a subdomain with docroot /home/USER/smart-church/public
#                     use smart-church/
#
# NOTE: SamKirkland/FTP-Deploy-Action does NOT speak SFTP. If your host only allows
# SSH/SFTP, replace the "Publish to cPanel" step with an SFTP-capable action
# (see docs/DEPLOY-dev.lit-grp.com.md -> "Transports: FTPS vs SFTP").
#
# See docs/CPANEL-DEPLOYMENT.md for the full walkthrough.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      note:
        description: Short note describing this manual deployment
        required: false
        default: Manual deployment

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Matches the Local dev environment (PHP 8.0.30) and composer.json ("php": "^7.3|^8.0").
  # Change to 8.1/8.2 only if your cPanel account runs that version.
  PHP_VERSION: '8.0'

jobs:
  deploy:
    name: Build and publish to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, json, mbstring, openssl, pdo, pdo_mysql, session, simplexml, tokenizer, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Create build-time .env
        run: cp .env.example .env

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate build-time application key
        run: php artisan key:generate --force

      - name: Rebuild the package manifest
        run: php artisan package:discover --ansi

      - name: Smoke test the build
        run: |
          php -l public/index.php
          php -r "require 'vendor/autoload.php'; echo 'Composer autoloader OK', PHP_EOL;"
          php artisan --version

      - name: Validate deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          missing=0
          for pair in "CPANEL_HOST:$CPANEL_HOST" "CPANEL_USER:$CPANEL_USER" "CPANEL_PASSWORD:$CPANEL_PASSWORD"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error title=Missing repository secret::$name is not set. See docs/CPANEL-DEPLOYMENT.md."
              missing=1
            fi
          done
          exit $missing

      - name: Publish to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          protocol: ${{ vars.CPANEL_PROTOCOL || 'ftps' }}
          port: ${{ vars.CPANEL_PORT || 21 }}
          # The MAIN cPanel account is jailed to your home directory, so "/" would drop
          # the app NEXT TO public_html instead of inside it. Default to public_html/.
          # A dedicated FTP account jailed to public_html/ must use "/" instead.
          server-dir: ${{ vars.CPANEL_REMOTE_DIR || 'public_html/' }}
          local-dir: ./
          # Shared-hosting TLS certificates are frequently self-signed.
          security: loose
          # NEVER true: it deletes anything on the server that is not in the repo,
          # which would wipe every member photo and uploaded PDF.
          dangerous-clean-slate: false
          log-level: standard
          timeout: 120000
          exclude: |
            **/.git/**
            **/.github/**
            **/.idea/**
            **/.vscode/**
            **/node_modules/**
            .gitignore
            .gitattributes
            .editorconfig
            .styleci.yml
            .ftp-deploy-sync-state.json
            .env
            .env.*
            package.json
            webpack.mix.js
            phpunit.xml
            tests/**
            docs/**
            scripts/**
            README.md
            check_*.php
            debug_*.php
            fix_escape.php
            task_progress.json
            test-login.html
            public/test-login.html

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## cPanel deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Transport | \`${{ vars.CPANEL_PROTOCOL || 'ftps' }}:${{ vars.CPANEL_PORT || 21 }}\` |"
            echo "| Remote directory | \`${{ vars.CPANEL_REMOTE_DIR || 'public_html/' }}\` |"
            echo "| Triggered by | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
