<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TIU has moved to Smart Church</title>

    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://smartchurch.tcnikorodu.org/">

    <!-- Works with JavaScript disabled, and with it the page never lingers. -->
    <meta http-equiv="refresh" content="0; url=https://smartchurch.tcnikorodu.org/">
    <script>window.location.replace("https://smartchurch.tcnikorodu.org/");</script>

    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            background: #f4f6f9; color: #2b3440;
            font: 16px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px; text-align: center;
        }
        .card {
            max-width: 520px; background: #fff; border-radius: 14px;
            padding: 40px 32px; box-shadow: 0 10px 30px rgba(20, 40, 70, .08);
        }
        h1 { margin: 0 0 10px; font-size: 22px; }
        p { margin: 0 0 22px; color: #5a6775; }
        a.button {
            display: inline-block; padding: 12px 22px; border-radius: 8px;
            background: #1b5e20; color: #fff; text-decoration: none; font-weight: 600;
        }
        a.button:hover { background: #14471a; }
        small { display: block; margin-top: 18px; color: #8a94a0; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>TIU has moved</h1>
        <p>This address is no longer in use. The church system now lives at
           <strong>smartchurch.tcnikorodu.org</strong>. You are being redirected&hellip;</p>
        <a class="button" href="https://smartchurch.tcnikorodu.org/">Go to Smart Church</a>
        <small>Bookmark the new address. If nothing happens, tap the button above.</small>
    </div>
</body>
</html>
