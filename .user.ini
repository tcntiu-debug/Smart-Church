; =====================================================================
; Smart-Church - per-directory PHP settings (.user.ini)
; ---------------------------------------------------------------------
; Honoured by PHP-FPM and the CGI/FastCGI SAPIs, which is how cPanel's
; ea-phpXX builds normally run. mod_php ignores this file - on a mod_php
; host set the same value in cPanel > MultiPHP INI Editor (or php.ini).
; PHP caches user_ini files for user_ini.cache_ttl (default 300s).
;
; session.upload_progress.enabled=0
;   Interim mitigation for CVE-2026-109619 (PHP RCE advisories of
;   21 Oct 2026, "PHP2Shell"). The feature is unused in this project:
;   no session_start() call and no session.upload_progress reference
;   exists in app/, config/, routes/ or public/, and sessions use
;   Laravel's own file driver (config/session.php). Disabling it costs
;   nothing here.
;
;   Keep it after patching to 8.3.36+ - PHP's own advisory recommends
;   leaving the "hardly-used and hardly-tested" feature off anyway.
;   Background and the patching runbook: docs/SECURITY-PHP-RCE-OCT-2026.md
; =====================================================================

session.upload_progress.enabled=0
